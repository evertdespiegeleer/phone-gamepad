[package]
name = "phone-gamepad"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
local-ip-address = "0.6.13"
qrcode = "0.14.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal_size = "0.4.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
